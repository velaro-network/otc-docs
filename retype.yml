# Velaro OTC API documentation — Retype config
input: .
output: .retype/otc
exclude:
  - cross-border/
  - landing/
url: https://docs.velaro.network/otc

favicon: /static/favicon.png

branding:
  title: Velaro OTC API
  label: Docs
  logo: /static/logo.png
  logoDark: /static/logo.png
  colors:
    label:
      light: "#0d9488"
      dark: "#2dd4bf"
    link:
      light: "#0d9488"
      dark: "#2dd4bf"

# Teal accent to match velaro.network
# (Retype's generator picks up `favicon`/branding; theme color below)
templating:
  enabled: true

links:
  - text: OTC API
    link: https://docs.velaro.network/otc/
    icon: arrow-switch
  - text: Cross-Border API
    link: https://docs.velaro.network/cross-border/
    icon: arrow-switch
  - text: Velaro
    link: https://velaro.network
  - text: Support
    link: /support/

order:
  - index.md
  - switch-to-cross-border.md
  - overview.md
  - authentication.md
  - rate-limits.md
  - errors.md
  - api
  - support.md

footer:
  copyright: "© Velaro."
